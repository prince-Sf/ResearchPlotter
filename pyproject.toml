[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "research-plotter"
version = "0.1.0"
description = "General-purpose scientific modeling, paper analysis, simulation, and visualization"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "Pillow>=10.0",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "pyarrow>=15.0",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "PyMuPDF>=1.24",
    "pypdf>=4.0",
    "PyYAML>=6.0",
    "pydantic>=2.5",
    "torch>=2.2",
    "tqdm>=4.66",
    "streamlit>=1.31",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
global-sensitivity = ["SALib>=1.5"]
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
research-plotter = "research_plotter.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["research_plotter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]
